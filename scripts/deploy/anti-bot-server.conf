# 在 server 块内引入，不改变已有 API 路由或转发目标。
limit_req zone=admin_auth burst=10 nodelay;
limit_req zone=admin_requests burst=60 nodelay;
limit_req_status 429;
limit_req_log_level warn;
include anti-bot-headers.conf;

error_page 429 = @admin_rate_limited;
location @admin_rate_limited {
  default_type application/json;
  include anti-bot-headers.conf;
  add_header Retry-After $admin_retry_after always;
  add_header Cache-Control "no-store" always;
  return 429 '{"code":429,"message":"请求过于频繁，请稍后再试"}';
}
