# 在 http 块内引入。空 key 不计入限流，不限制正常静态资源并发加载。
map "$request_method:$uri" $admin_auth_rate_key {
  default "";
  ~^POST:/api/system/auth/(login|sms/verify|challenges/[^/]+/sms)/?$ $binary_remote_addr;
}

map $uri $admin_request_rate_key {
  default $binary_remote_addr;
  ~^/(js|css|jse)/ "";
  ~^/(favicon\.png|logo\.png|avatar\.svg|robots\.txt)$ "";
}

map $admin_auth_rate_key $admin_retry_after {
  "" 1;
  default 60;
}

limit_req_zone $admin_auth_rate_key zone=admin_auth:10m rate=30r/m;
limit_req_zone $admin_request_rate_key zone=admin_requests:10m rate=20r/s;
