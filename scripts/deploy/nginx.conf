
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  mjs;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_vary on;

  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    # 下载仅代理固定资源站，不转发管理后台的凭据。
    location ^~ /resource-download/ {
      # 在请求时解析，资源站临时 DNS 故障不能阻止整个后台启动。
      # 私有解析环境请将 resolver 换为部署环境的 DNS 地址。
      resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
      resolver_timeout 5s;
      set $resource_origin app-res.mc.cn;
      rewrite ^/resource-download/(.*)$ /soft/$1 break;
      proxy_pass http://$resource_origin;
      proxy_set_header Host app-res.mc.cn;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_hide_header Set-Cookie;
      proxy_hide_header Content-Disposition;
      add_header Content-Disposition "attachment";
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
      gzip off;
    }

    # 带内容哈希的构建产物可长期缓存；缺失文件返回 404，避免被入口 HTML 替代。
    location ~* "^/(js|css|jse)/.*-[a-z0-9_-]{8}\.(js|mjs|css)$" {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(index\.html|_app\.config\.js)$ {
      try_files $uri =404;
      add_header Cache-Control "no-store";
    }

    # 系统接口共用 /config-api 入口，转为后端的 /api/system 路径。
    location ^~ /config-api/system/ {
      proxy_pass http://192.168.5.197:8080/api/system/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
    }

    # 业务接口去掉 /config-api 前缀后转发到同一个服务。
    location ^~ /config-api/ {
      proxy_pass http://192.168.5.197:8080/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      add_header Cache-Control "no-cache";
      # Enable CORS
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
      }
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
