name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  check:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm lint
      - run: pnpm check:type

  test:
    name: Application Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm exec vitest run apps/web-antd/src --maxWorkers=2 --testTimeout=20000

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm build:antd

  ci-ok:
    name: CI OK
    if: always()
    runs-on: ubuntu-latest
    needs: [check, test, build]
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require all checks to pass
        run: node -e "if(Object.values(JSON.parse(process.env.RESULTS)).some(job=>job.result!=='success'))process.exit(1)"
